services:
  easy-server-cloner:
    build: .
    container_name: easy-server-cloner
    restart: unless-stopped

    # The token comes from .env and never ends up in the image.
    env_file:
      - .env

    volumes:
      # Backups and interrupted runs survive every restart this way.
      - ./backups:/app/backups
      - ./state:/app/state

    # The bot only makes outbound connections — no ports exposed.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
