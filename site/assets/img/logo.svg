<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" role="img" aria-label="Easy Server Cloner">
  <defs>
    <linearGradient id="escFill" x1="20" y1="26" x2="96" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#C2B2FF"/>
      <stop offset="0.5" stop-color="#9B8AFF"/>
      <stop offset="1" stop-color="#6C58F0"/>
    </linearGradient>
    <linearGradient id="escStroke" x1="58" y1="18" x2="114" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A695FF"/>
      <stop offset="1" stop-color="#6B59F0"/>
    </linearGradient>

    <mask id="escDissolve" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <g fill="#000">
        <!-- Kappt die linke Spitze glatt ab … -->
        <rect x="0" y="0" width="30" height="128"/>
        <!-- … und staffelt die neue Kante zu einer Pixel-Treppe. -->
        <rect x="30" y="34" width="10" height="16"/>
        <rect x="30" y="78" width="10" height="16"/>
        <!-- Zwei Löcher mitten in der Fläche -->
        <rect x="45" y="50" width="9" height="9"/>
        <rect x="45" y="69" width="9" height="9"/>
      </g>
    </mask>
  </defs>

  <!-- Hintere, offene Raute -->
  <rect x="46" y="24" width="62" height="62" rx="13"
        transform="rotate(45 77 55)" stroke="url(#escStroke)" stroke-width="5.5"/>

  <!-- Die Maske hängt an der Gruppe, nicht an der gedrehten Raute — sonst
       würde sie mitrotieren und die Pixel stünden schief. -->
  <g mask="url(#escDissolve)">
    <rect x="28" y="34" width="60" height="60" rx="13"
          transform="rotate(45 58 64)" fill="url(#escFill)"/>
  </g>

  <!-- Davonfliegende Pixel: nach links kleiner und blasser -->
  <g fill="url(#escFill)">
    <rect x="30" y="52" width="9" height="9" opacity="0.95"/>
    <rect x="30" y="67" width="9" height="9" opacity="0.95"/>
    <rect x="19" y="45" width="9" height="9" opacity="0.85"/>
    <rect x="19" y="74" width="9" height="9" opacity="0.8"/>
    <rect x="9" y="59" width="9" height="9" opacity="0.72"/>
    <rect x="10" y="36" width="7" height="7" opacity="0.5"/>
    <rect x="10" y="85" width="7" height="7" opacity="0.45"/>
    <rect x="0" y="46" width="6" height="6" opacity="0.36"/>
    <rect x="1" y="74" width="5" height="5" opacity="0.26"/>
  </g>
</svg>
